<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C81E51"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  
  <!-- Subtle Islamic Geometric Circle Border -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="#FFFFFF" stroke-width="6" opacity="0.15" stroke-dasharray="14 10"/>
  
  <!-- Crescent & Star -->
  <path d="M256,120 A130,130 0 1,0 368,328 A150,150 0 1,1 256,120 Z" fill="url(#gold)" opacity="0.95"/>
  <polygon points="340,165 352,200 388,200 359,222 370,256 340,235 310,256 321,222 292,200 328,200" fill="url(#gold)"/>

  <!-- Mosque Silhouette -->
  <g fill="#FFFFFF" opacity="0.95" transform="translate(106, 210) scale(0.6)">
    <!-- Central Dome -->
    <path d="M 250 50 C 200 50 150 120 150 200 L 350 200 C 350 120 300 50 250 50 Z"/>
    <rect x="150" y="200" width="200" height="150" rx="8"/>
    <path d="M 210 350 L 210 270 C 210 240 290 240 290 270 L 290 350 Z" fill="url(#bg)"/>

    <!-- Left Minaret -->
    <rect x="70" y="80" width="35" height="270" rx="4"/>
    <path d="M 87.5 30 L 60 80 L 115 80 Z"/>
    <rect x="65" y="140" width="45" height="15" rx="3"/>

    <!-- Right Minaret -->
    <rect x="395" y="80" width="35" height="270" rx="4"/>
    <path d="M 412.5 30 L 385 80 L 440 80 Z"/>
    <rect x="390" y="140" width="45" height="15" rx="3"/>
  </g>
</svg>